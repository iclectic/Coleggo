name: Flutter CI

on:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'

jobs:
  analyse-and-test:
    name: Analyse and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep current Material imports until a deliberate material_ui migration.
          # Info-level deprecations must not fail the gate.
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub
